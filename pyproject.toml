[project]
name = "dejaops"
version = "0.1.0"
description = "On-call incident copilot with CockroachDB as its agentic memory layer"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "mangum>=0.19",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "boto3>=1.35",
    "anthropic[bedrock]>=0.116",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dejaops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
